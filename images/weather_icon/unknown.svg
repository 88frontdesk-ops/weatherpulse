<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Weather Blue Gradient -->
    <linearGradient id="weatherBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="100%" stop-color="#29B6F6" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Outer Neutral Weather Circle Ring -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="url(#weatherBlue)" stroke-width="4" stroke-linecap="round" stroke-dasharray="135 25" transform="rotate(-90 32 32)" />

    <!-- Centered Neutral Question Mark -->
    <!-- Arc & Stem -->
    <path d="M 24.5 24.5 C 24.5 17.5, 39.5 17.5, 39.5 26.5 C 39.5 32.5, 32 33.5, 32 40" 
          fill="none" 
          stroke="url(#weatherBlue)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Dot -->
    <circle cx="32" cy="48" r="3" fill="url(#weatherBlue)" />
  </g>
</svg>
